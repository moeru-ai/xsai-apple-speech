name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  native:
    strategy:
      matrix:
        include:
          - runner: macos-26
            target: arm64
          - runner: macos-26-intel
            target: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: TARGET_ARCH=${{ matrix.target }} pnpm build:native
      - run: pnpm --filter @xsai-apple-speech/transcription-native test:native
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: packages/transcription-native/npm/darwin-*/apple-speech-transcription.node

  electron:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - run: pnpm build
      - run: CSC_IDENTITY_AUTO_DISCOVERY=false pnpm --filter @xsai-apple-speech/example-electron package
      - run: test -f "examples/electron/dist/mac-arm64/xsAI Apple Speech Example.app/Contents/Resources/app.asar"
      - run: find examples/electron/dist -path '*app.asar.unpacked*' -name '*.node' -print -quit | grep .
